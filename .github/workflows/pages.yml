# Publica a versão estática do Achados UFG (pasta codigo/achados-ufg/public) no GitHub Pages.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: TFD_IHC_AchadosUFG/codigo/achados-ufg/public
      - id: deploy
        uses: actions/deploy-pages@v5
