<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Achados UFG: achados e perdidos com inteligência artificial para a comunidade da Universidade Federal de Goiás.">
  <meta name="theme-color" content="#0B4F94">
  <title>Achados UFG</title>
  <link rel="icon" href="img/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo">
    <div class="topo-interno">
      <a class="marca" href="#/" aria-label="Achados UFG, página inicial">
        <img src="img/icone.svg" alt="" width="36" height="36">
        <span>Achados <strong>UFG</strong></span>
      </a>
      <nav class="nav-topo" aria-label="Principal">
        <a href="#/" data-rota="inicio">Início</a>
        <a href="#/buscar" data-rota="buscar">Perdi algo</a>
        <a href="#/encontrei" data-rota="encontrei">Encontrei algo</a>
        <a href="#/painel" data-rota="painel">Meu painel</a>
      </nav>
      <div class="acoes-topo">
        <button class="icone-btn" id="btn-acessibilidade" aria-haspopup="true" aria-expanded="false" aria-controls="menu-acessibilidade" title="Acessibilidade">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M4 8h16M12 8v6m0 0-4 7m4-7 4 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="sr">Opções de acessibilidade</span>
        </button>
        <a class="icone-btn" href="#/painel?aba=notificacoes" id="btn-sino" title="Notificações">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1 1 12 0v6l2 2H4zM10 21h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span class="selo" id="selo-notificacoes" hidden>0</span>
          <span class="sr" id="sr-notificacoes">Notificações</span>
        </a>
        <button class="avatar" id="btn-usuario" title="Trocar usuário"><span aria-hidden="true">?</span><span class="sr">Trocar usuário</span></button>
      </div>
    </div>
    <div class="menu-acessibilidade" id="menu-acessibilidade" role="group" aria-label="Acessibilidade" hidden>
      <span>Tamanho do texto</span>
      <button data-fonte="-1" aria-label="Diminuir texto">A−</button>
      <button data-fonte="0" aria-label="Texto padrão">A</button>
      <button data-fonte="1" aria-label="Aumentar texto">A+</button>
      <label class="alternar"><input type="checkbox" id="alto-contraste"> Alto contraste</label>
    </div>
  </header>

  <div class="faixa-modo" id="faixa-modo" hidden></div>

  <main id="conteudo" tabindex="-1"></main>

  <footer class="rodape">
    Achados UFG · Trabalho Final de IHC — INF/UFG, 2026 ·
    <a href="demo-fotos/CREDITOS.md">Créditos das fotos de exemplo (Wikimedia Commons)</a>
  </footer>

  <nav class="nav-inferior" aria-label="Navegação rápida">
    <a href="#/" data-rota="inicio"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Início</a>
    <a href="#/buscar" data-rota="buscar"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Perdi</a>
    <a href="#/encontrei" data-rota="encontrei" class="destaque"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v12H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>Encontrei</a>
    <a href="#/painel" data-rota="painel"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>Painel</a>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-raiz"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
